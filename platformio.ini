[platformio]
default_envs = esp32-s3-debug, esp32-s3-release
; Keep SDK packages/locks separate from other VS Code projects.
core_dir = .pio/idf-core

[env]
; Arduino 3.3.12 is compiled as a component of ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    wifwaf/MH-Z19@1.5.4
    adafruit/Adafruit AHTX0@2.0.5
    claws/BH1750@1.3.0
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:esp32-s3-debug]
build_type = debug
build_flags = -DDEBUG_ENABLED

[env:esp32-s3-release]
build_type = release
