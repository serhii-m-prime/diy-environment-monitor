[platformio]
default_envs = esp32-s3-debug, esp32-s3-release
; Keep native artifacts separate from the previous Arduino build tree.
build_dir = .pio/native-build
; Keep SDK packages/locks separate from other VS Code projects.
core_dir = .pio/idf-core
packages_dir = .pio/idf-core/packages
platforms_dir = .pio/idf-core/platforms
cache_dir = .pio/idf-core/.cache

[env]
; Arduino 3.3.12 is compiled as a component of ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
; Compile Arduino source as a CMake component, without the prebuilt SDK bundle.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
lib_compat_mode = off
extra_scripts = pre:tools/idf_env.py
build_flags = -DARDUINO_ARCH_ESP32 -DARDUINO=10812
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    wifwaf/MH-Z19@1.5.4
    adafruit/Adafruit AHTX0@2.0.5
    claws/BH1750@1.3.0
    adafruit/Adafruit BusIO@1.17.1
    adafruit/Adafruit Unified Sensor@1.1.15

[env:esp32-s3-debug]
build_type = debug
build_flags = ${env.build_flags} -DDEBUG_ENABLED

[env:esp32-s3-release]
build_type = release
